<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {%- if page.title -%}
        {{ page.title | escape }} | {{ site.title | escape }}
      {%- else -%}
        {{ site.title | escape }}
      {%- endif -%}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=20260725b' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/music.css?v=20260725' | relative_url }}">
    <script>
      (() => {
        const saved = localStorage.getItem("blog-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
      })();
    </script>
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["$", "$"], ["\\(", "\\)"]],
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  </head>
  <body>
    <div class="wallpaper-bg" id="wallpaper-bg"></div>
    <div class="site-shell">
      <header class="site-hero">
        <div class="hero-inner">
          <nav class="site-nav" aria-label="主导航">
            <a class="site-mark" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
            <div class="nav-links">
              <a href="{{ '/' | relative_url }}">首页</a>
              <a href="{{ '/article/' | relative_url }}">文学</a>
              <a href="{{ '/note/' | relative_url }}">笔记</a>
              <a href="{{ '/other/' | relative_url }}">其他</a>
              <a href="{{ '/write/' | relative_url }}">写文章</a>
              <a href="{{ '/about/' | relative_url }}">关于</a>
              <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换日夜模式">日</button>
            </div>
          </nav>
          <p class="hero-kicker">Personal Notes & Fiction</p>
          <h1 class="hero-title">{{ page.hero_title | default: page.title | default: site.title | escape }}</h1>
          <p class="hero-description">{{ page.hero_description | default: site.description | escape }}</p>
        </div>
      </header>

      <main class="page-wrap">
        {{ content }}
      </main>

      <footer class="site-footer">
        <span>{{ site.title | escape }}</span>
        <span> · </span>
        <span>{{ site.description | escape }}</span>
      </footer>
    </div>
    <div id="bilibili-player"></div>
    <script src="{{ '/assets/js/theme.js?v=20260524b' | relative_url }}"></script>
    <script src="{{ '/assets/js/music.js' | relative_url }}"></script>
    <script>
      (function() {
        // ── 壁纸列表：往这里加新图即可 ──
        var wallpapers = [
          '{{ "/assets/img/aquarium.jpg" | relative_url }}',
          '{{ "/assets/img/dreamy.jpg" | relative_url }}'
        ];
        if (!wallpapers.length) return;
        var pick = wallpapers[Math.floor(Math.random() * wallpapers.length)];
        var bg = document.getElementById('wallpaper-bg');
        var hero = document.querySelector('.site-hero');
        if (!bg || !hero) return;
        bg.style.backgroundImage = 'url("' + pick + '")';
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(e) {
            var show = !e.isIntersecting;
            bg.classList.toggle('visible', show);
            document.body.classList.toggle('wallpaper-active', show);
          });
        }, { threshold: 0 });
        observer.observe(hero);
      })();
    </script>
  </body>
</html>
